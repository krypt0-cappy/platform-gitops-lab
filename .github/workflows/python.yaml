name: Atlas Python CI

on:

  pull_request:

  push:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: automation/python

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check Formatting
        run: |
          python -m black --check atlas scripts tests

      - name: Lint
        run: |
          python -m ruff check atlas scripts tests

      - name: Run Tests
        run: |
          python -m pytest