[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-automation"
version = "0.1.0"
description = "Automation and inventory tooling for Project Atlas"
requires-python = ">=3.12"
dependencies = [
    "boto3",
]

[project.scripts]
atlas = "atlas.cli.main:main"

[project.optional-dependencies]
dev = [
    "black",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]