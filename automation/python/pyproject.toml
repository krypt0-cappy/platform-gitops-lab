[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-automation"
version = "0.1.0"
description = "Automation and inventory tooling for Project Atlas"
requires-python = ">=3.12"
dependencies = [
    "boto3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas*"]